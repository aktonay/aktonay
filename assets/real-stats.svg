  </text>
  <line x1="32" y1="52" x2="788" y2="52" stroke="#292e42" stroke-width="1"/>

  <!-- Metric 1: Total Contributions -->
  <g transform="translate(32, 68)">
    <rect width="170" height="142" rx="10" fill="#1f2335" stroke="#292e42" stroke-width="1"/>
    <circle cx="28" cy="30" r="14" fill="#38bdf8" fill-opacity="0.15"/>
    <path d="M28 22v16M20 30h16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="28" y="78" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">442+</text>
    <text x="28" y="104" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Total Contributions</text>
    <text x="28" y="124" fill="#7aa2f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">Verified GitHub Activity</text>
  </g>

  <!-- Metric 2: Enterprise Private Commits -->
  <g transform="translate(222, 68)">
    <rect width="170" height="142" rx="10" fill="#1f2335" stroke="#292e42" stroke-width="1"/>
    <circle cx="28" cy="30" r="14" fill="#10b981" fill-opacity="0.15"/>
    <path d="M23 29V25a5 5 0 0 1 10 0v4m-12 0h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H21a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="78" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">384</text>
    <text x="28" y="104" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Private Commits</text>
