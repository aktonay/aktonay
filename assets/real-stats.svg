  </g>

  <!-- Metric 3: Primary Language (Python) -->
  <g transform="translate(412, 68)">
    <rect width="185" height="142" rx="10" fill="#1f2335" stroke="#292e42" stroke-width="1"/>
    <circle cx="28" cy="30" r="14" fill="#ffd343" fill-opacity="0.15"/>
    <!-- Python icon sketch -->
    <text x="28" y="35" text-anchor="middle" font-size="16">🐍</text>
    <text x="28" y="78" fill="#ffd343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">Python</text>
    <text x="28" y="104" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">#1 Core Language</text>
    <text x="28" y="124" fill="#e0af68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">&gt;80% AI, RAG &amp; Agents</text>
  </g>

  <!-- Metric 4: Research & Impact -->
  <g transform="translate(617, 68)">
    <rect width="171" height="142" rx="10" fill="#1f2335" stroke="#292e42" stroke-width="1"/>
    <circle cx="28" cy="30" r="14" fill="#bb9af7" fill-opacity="0.15"/>
    <path d="M28 20l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1 3-6z" stroke="#bb9af7" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="28" y="78" fill="#bb9af7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">3</text>
    <text x="28" y="104" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Research Papers</text>
    <text x="28" y="124" fill="#bb9af7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">IEEE &amp; Springer Nature</text>
